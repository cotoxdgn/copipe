<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>端末間コピペ</title>
<meta name="theme-color" content="#F6F5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="コピペ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- メイン画面 -->
<div id="main" class="view" hidden>
  <header class="bar">
    <h1>端末間コピペ</h1>
    <span class="updated" id="updated"></span>
    <span class="chip" id="deviceChip"></span>
    <button type="button" class="icon-btn" id="refreshBtn" aria-label="更新">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      <span class="wide-only">更新</span>
    </button>
    <button type="button" class="icon-btn" id="settingsBtn" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="layout">
    <section class="save-area">
      <button type="button" class="paste-btn" id="pasteBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M12 11v6"/><path d="m9 14 3 3 3-3"/></svg>
        <span id="pasteLabel">貼り付けて保存</span>
      </button>
      <p class="hint" id="pasteHint"></p>
      <form class="manual" id="manualForm">
        <label for="manualInput" class="manual-label">手入力</label>
        <textarea id="manualInput" rows="1" placeholder="または、ここに入力して保存"></textarea>
        <button type="submit" class="outline-btn">保存</button>
      </form>
    </section>

    <section class="history">
      <div class="history-head">
        <h2>履歴 <span class="count" id="count"></span></h2>
        <span class="updated narrow-only" id="updated2"></span>
      </div>
      <p class="empty" id="empty" hidden>まだ何も保存されていません</p>
      <ul class="list" id="list"></ul>
    </section>
  </div>
</div>

<!-- 設定画面 -->
<div id="setup" class="view" hidden>
  <form class="setup" id="setupForm">
    <div>
      <h1 id="setupTitle">はじめての設定</h1>
      <p class="lead">端末ごとに最初の1回だけ入力します。2台目以降も同じURLと合言葉を入れてください。</p>
    </div>
    <div class="card fields">
      <label>
        <span class="f-label">1. スプレッドシートの接続URL</span>
        <input type="url" id="cfgUrl" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false">
        <span class="f-help">スプシで「ウェブアプリとして公開」したときに出るURLです</span>
      </label>
      <label>
        <span class="f-label">2. 合言葉</span>
        <input type="password" id="cfgKey" required autocomplete="off">
        <span class="f-help">スプシの「設定」シートB1に入れた合言葉と同じもの</span>
      </label>
      <label>
        <span class="f-label">3. この端末の名前</span>
        <input type="text" id="cfgDevice" required maxlength="30">
        <span class="f-help">自動で入ります。履歴の「どこから保存したか」に表示</span>
      </label>
    </div>
    <div class="status" id="setupStatus" hidden></div>
    <div class="setup-actions">
      <button type="button" class="outline-btn big" id="testBtn">接続テスト</button>
      <button type="submit" class="solid-btn big" id="saveCfgBtn">保存してはじめる</button>
      <button type="button" class="text-btn" id="cancelSetupBtn" hidden>もどる</button>
      <p class="hint center">設定はあとから右上の歯車で変更できます</p>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="itemTpl">
  <li class="item">
    <div class="item-body">
      <div class="meta"><span class="pin-label">ピン留め</span><span class="device"></span><span class="time"></span></div>
      <p class="text"></p>
    </div>
    <div class="actions">
      <button type="button" class="solid-btn small copy">コピー</button>
      <a class="outline-btn small open" target="_blank" rel="noopener noreferrer">開く</a>
      <span class="spacer"></span>
      <button type="button" class="icon-plain pin" aria-label="ピン留め">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6l-1 6 4 4H6l4-4z"/></svg>
      </button>
      <button type="button" class="icon-plain del" aria-label="削除">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m6 6 1 14h10l1-14"/></svg>
      </button>
    </div>
  </li>
</template>

<script src="app.js"></script>
</body>
</html>
